<!-- Site footer -->
<footer class="site-footer">
    <div class="container footer-inner">
        <p class="footer-copy">© {{ site.time | date: "%Y" }} {{ site.title }} · 用 <a href="https://jekyllrb.com" rel="noopener" target="_blank">Jekyll</a> 书写于 <a href="{{ site.url }}" rel="noopener">{{ site.url | remove: "https://" }}</a></p>
        <div class="footer-links">
            <a href="{{ site.baseurl }}/feed.xml">RSS 订阅</a>
            <button class="back-top" id="backTop" type="button" aria-label="回到顶部">回到顶部 ↑</button>
        </div>
    </div>
</footer>
